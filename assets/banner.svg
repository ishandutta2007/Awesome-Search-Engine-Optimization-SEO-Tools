<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="rankLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #334155;
      stroke-width: 0.5;
      stroke-opacity: 0.25;
    }
    .orbit-pulse {
      animation: pulseAnim 4s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: glowAnim 3s ease-in-out infinite alternate;
    }
    .flow-wave {
      stroke-dasharray: 8 6;
      animation: dashWave 25s linear infinite;
    }
    .flow-rev {
      stroke-dasharray: 6 8;
      animation: dashWaveRev 20s linear infinite;
    }
    .float-card {
      animation: floatMotion 6s ease-in-out infinite alternate;
    }
    .float-card-2 {
      animation: floatMotion2 7s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { r: 120px; opacity: 0.12; }
      100% { r: 160px; opacity: 0.26; }
    }
    @keyframes glowAnim {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }
    @keyframes dashWave {
      to { stroke-dashoffset: -400; }
    }
    @keyframes dashWaveRev {
      to { stroke-dashoffset: 400; }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatMotion2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Glowing Ambience in Background -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#neonGlow)" opacity="0.1" class="pulse-glow" />
  <circle cx="1020" cy="270" r="160" fill="#a855f7" filter="url(#neonGlow)" opacity="0.12" class="pulse-glow" />
  <circle cx="600" cy="180" r="130" fill="none" stroke="#6366f1" stroke-width="1.5" class="orbit-pulse" />

  <!-- Grid lines -->
  <g class="bg-grid">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Background Dynamic SEO Data Waves & Graph Line -->
  <g opacity="0.45">
    <!-- Trend Area Fill -->
    <path d="M 50 310 Q 250 290 400 240 T 750 180 T 1000 110 T 1150 70 L 1150 340 L 50 340 Z" fill="url(#accentGlow)" />
    <!-- Rising SERP Curve -->
    <path d="M 50 310 Q 250 290 400 240 T 750 180 T 1000 110 T 1150 70" fill="none" stroke="url(#rankLineGrad)" stroke-width="3.5" class="flow-wave" />
    <path d="M 50 330 Q 300 320 520 280 T 880 200 T 1150 120" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" class="flow-rev" />
  </g>

  <!-- Floating Dynamic Metric Badges (Safe Sides & Lower Margins) -->
  <g class="float-card" transform="translate(940, 45)">
    <rect width="180" height="54" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="24" cy="27" r="7" fill="#10b981" />
    <text x="42" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">SERP POSITION</text>
    <text x="42" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">#1 Ranked ▲</text>
  </g>

  <g class="float-card-2" transform="translate(940, 115)">
    <rect width="180" height="54" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="24" cy="27" r="7" fill="#a855f7" />
    <text x="42" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">ORGANIC TRAFFIC</text>
    <text x="42" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">+418.5% Growth</text>
  </g>

  <!-- Foreground Main Branding & Typography (Guaranteed Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome SEO Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="192" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Search Engine Optimization, GEO &amp; AI Visibility Intelligence
    </text>

    <!-- Detailed Tagline -->
    <text x="0" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Keyword Research • Rank Tracking • Site Auditing • Backlink Analysis • LLM Citations
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 260)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="128" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ SaaS Giants</text>

      <!-- Tag 2 -->
      <rect x="138" y="0" width="154" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.8" />
      <text x="150" y="20" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛠️ Open-Source Audits</text>

      <!-- Tag 3 -->
      <rect x="302" y="0" width="136" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.8" />
      <text x="314" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI &amp; GEO Skills</text>

      <!-- Tag 4 -->
      <rect x="448" y="0" width="150" height="32" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.8" />
      <text x="460" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📈 SERP Rank Tracking</text>
    </g>
  </g>
</svg>
